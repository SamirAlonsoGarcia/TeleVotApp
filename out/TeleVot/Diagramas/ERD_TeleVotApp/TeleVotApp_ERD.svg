th="643.7317" x="3304.1667" y="1903.7333">- Un Certificado pertenece a UN propietario:</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="428.5563" x="3322.7091" y="1937.6851">(Usuario XOR MesaElectoral).</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="729.48" x="3304.1667" y="1971.637">- En BD se modela con dos OneToOne opcionales,</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="571.0144" x="3322.7091" y="2005.5888">y se garantiza por l&#243;gica de aplicaci&#243;n.</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="266" id="ent0057"><path d="M2401.0417,2290.625 L2401.0417,2324.0604 L1655.2794,2200.1887 L2401.0417,2340.727 L2401.0417,2481.2174 A0,0 0 0 0 2401.0417,2481.2174 L3004.128,2481.2174 A0,0 0 0 0 3004.128,2481.2174 L3004.128,2311.4583 L2983.2947,2290.625 L2401.0417,2290.625 A0,0 0 0 0 2401.0417,2290.625" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0417;"/><path d="M2983.2947,2290.625 L2983.2947,2311.4583 L3004.128,2311.4583 L2983.2947,2290.625" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0417;"/><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="344.5028" x="2413.5417" y="2328.1148">Anonimato / desacoplo:</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="559.3363" x="2413.5417" y="2362.0667">- El voto se almacena como hashVoto.</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="525.8403" x="2413.5417" y="2396.0185">- idUsuario es nullable para permitir</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="489.268" x="2432.0841" y="2429.9703">romper la relaci&#243;n identidad-voto</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="372.8434" x="2432.0841" y="2463.9221">tras el cierre del proceso.</text></g><g class="entity" data-qualified-name="GMN59" data-source-line="274" id="ent0060"><path d="M1071.875,3032.2917 L1071.875,3188.9323 A0,0 0 0 0 1071.875,3188.9323 L1808.6466,3188.9323 A0,0 0 0 0 1808.6466,3188.9323 L1808.6466,3053.125 L1787.8133,3032.2917 L1448.9583,3032.2917 L1440.625,2994.386 L1432.2917,3032.2917 L1071.875,3032.2917 A0,0 0 0 0 1071.875,3032.2917" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0417;"/><path d="M1787.8133,3032.2917 L1787.8133,3053.125 L1808.6466,3053.125 L1787.8133,3032.2917" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0417;"/><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="408.8888" x="1084.375" y="3069.7815">Restricciones de integridad:</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="461.1837" x="1084.375" y="3103.7333">- unique(votacion, candidatura)</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="663.4135" x="1084.375" y="3137.6851">- unique(votacion, director) si director != null</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="693.0216" x="1084.375" y="3171.637">(garantiza 1 director de campa&#241;a por votaci&#243;n)</text></g><g class="entity" data-qualified-name="GMN62" data-source-line="281" id="ent0063"><path d="M1056.25,1680.2083 L1056.25,1802.8971 A0,0 0 0 0 1056.25,1802.8971 L1824.5667,1802.8971 A0,0 0 0 0 1824.5667,1802.8971 L1824.5667,1701.0417 L1803.7333,1680.2083 L1448.9583,1680.2083 L1440.625,1642.3272 L1432.2917,1680.2083 L1056.25,1680.2083 A0,0 0 0 0 1056.25,1680.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0417;"/><path d="M1803.7333,1680.2083 L1803.7333,1701.0417 L1824.5667,1701.0417 L1803.7333,1680.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0417;"/><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="280.0171" x="1068.75" y="1717.6982">Tablas puente N:N:</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="585.4838" x="1068.75" y="1751.65">- Implementan many-to-many expl&#237;citos</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="724.5667" x="1068.75" y="1785.6018">- Refuerzan integridad mediante unique_together</text></g><g class="entity" data-qualified-name="GMN65" data-source-line="288" id="ent0066"><path d="M2189.5833,2517.7083 L2189.5833,2562.1037 L1706.2779,2546.4354 L2189.5833,2578.7703 L2189.5833,2674.349 A0,0 0 0 0 2189.5833,2674.349 L3214.6322,2674.349 A0,0 0 0 0 3214.6322,2674.349 L3214.6322,2538.5417 L3193.7988,2517.7083 L2189.5833,2517.7083 A0,0 0 0 0 2189.5833,2517.7083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0417;"/><path d="M3193.7988,2517.7083 L3193.7988,2538.5417 L3214.6322,2538.5417 L3193.7988,2517.7083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0417;"/><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="524.2879" x="2202.0833" y="2555.1982">Resultados persistidos (agregados):</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="551.005" x="2202.0833" y="2589.15">- Se guarda participaci&#243;n y ganadora.</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="981.2988" x="2202.0833" y="2623.1018">- El detalle por candidatura se almacena en ResultadoCandidatura.</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="580.8268" x="2202.0833" y="2657.0536">- No se almacena relaci&#243;n voto-usuario.</text></g><g class="entity" data-qualified-name="GMN68" data-source-line="295" id="ent0069"><path d="M2361.4583,2980.2083 L2361.4583,3102.8971 A0,0 0 0 0 2361.4583,3102.8971 L3043.2149,3102.8971 A0,0 0 0 0 3043.2149,3102.8971 L3043.2149,3001.0417 L3022.3816,2980.2083 L2710.4167,2980.2083 L2702.0833,2942.7599 L2693.75,2980.2083 L2361.4583,2980.2083 A0,0 0 0 0 2361.4583,2980.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0417;"/><path d="M3022.3816,2980.2083 L3022.3816,3001.0417 L3043.2149,3001.0417 L3022.3816,2980.2083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0417;"/><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="375.7487" x="2373.9583" y="3017.6982">Restricci&#243;n de integridad:</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="473.6877" x="2373.9583" y="3051.65">- unique(resultado, candidatura)</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="638.0066" x="2373.9583" y="3085.6018">(una fila por candidatura en cada recuento)</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk22"><polygon fill="#181818" points="572.4977,1383.3333,591.2477,1391.6667,582.9143,1383.3333,591.2477,1375,572.4977,1383.3333" style="stroke:#181818;stroke-width:2.0833;"/><path d="M584.9977,1383.3333 C775.2859,1383.3333 1024.9481,1383.3333 1210.8564,1383.3333" fill="none" style="stroke:#181818;stroke-width:2.0833;"/><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="154.6916" x="770.8333" y="1372.9065">IdVotacion</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="51.6825" x="1158.7731" y="1412.4898">0..*</text><text fill="#000000" font-family="sans-serif" font-size="29.1667" lengthAdjust="spacing" textLength="18.5567" x="574.581" y="1412.4898">1</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0012" data-link-t