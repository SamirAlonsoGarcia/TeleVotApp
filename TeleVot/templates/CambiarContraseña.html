{% load static %}
<title>CAMBIO DE CONTRASEÑA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<body>
  <div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="mb-0" style="color:#103957;">Cambio de contraseña</h2>
        <p class="text-muted mb-0">Introduce tus datos para actualizar la contraseña.</p>
      </div>
      <img src="{% static 'images/logoApp.png' %}" class="rounded" alt="AppLogo" width="120" height="120">
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">

        <div class="card shadow-sm">
          <div class="card-header text-white" style="background-color:#103957;">
            <h5 class="mb-0">Rellena los siguientes campos</h5>
          </div>

          <div class="card-body">
            <form method="post" action="{% url 'modificar_contraseña' %}">
              {% csrf_token %}

              <div class="mb-3">
                <label for="usuario_id" class="form-label">Documento Fiscal</label>
                <input type="text" id="usuario_id" name="usuario_id" required class="form-control"
                       placeholder="Ej: 12345678X">
              </div>

              <div class="mb-3">
                <label for="antigua_contraseña" class="form-label">Contraseña antigua</label>
                <div class="input-group">
                  <input type="password" class="form-control" name="antigua_contraseña" id="antigua_contraseña" required>
                  <button class="btn btn-outline-secondary toggle-password" type="button" data-target="antigua_contraseña">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <div class="mb-3">
                <label for="nueva_contraseña" class="form-label">Nueva contraseña</label>
                <div class="input-group">
                  <input type="password" class="form-control" name="nueva_contraseña" id="nueva_contraseña" required>
                  <button class="btn btn-outline-secondary toggle-password" type="button" data-target="nueva_contraseña">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div class="form-text">Recomendado: mínimo 6 caracteres.</div>
              </div>

              <div class="mb-4">
                <label for="confirmar_contraseña" class="form-label">Confirmar nueva contraseña</label>
                <div class="input-group">
                  <input type="password" class="form-control" name="confirmar_contraseña" id="confirmar_contraseña" required>
                  <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirmar_contraseña">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary" style="background-color:#103957; border-color:#103957;">
                  Cambiar contraseña
                </button>
                <a href="{% url 'login' %}" class="btn btn-outline-secondary">Cancelar</a>
              </div>

            </form>
          </div>
        </div>

        {% if messages %}
          <div class="mt-3">
            {% for message in messages %}
              <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'warning' %}alert-warning{% else %}alert-success{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}

      </div>
    </div>
  </div>

<script>
  document.querySelectorAll('.toggle-password').forEach(button => {
    button.addEventListener('click', function () {
      const targetId = this.getAttribute('data-target');
      const input = document.getElementById(targetId);
      const icon = this.querySelector('i');

      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    });
  });
</script>
</body>
